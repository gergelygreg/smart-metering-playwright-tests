apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-event-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-event-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-event-service
    spec:
      containers:
        - name: kafka-event-service
          image: smart-metering-kafka-event-service:k8s-local
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8100
          env:
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: smart-metering-config
                  key: KAFKA_BROKERS
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-metering-config
                  key: API_BASE_URL
            - name: HEALTH_PORT
              value: "8100"
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 750m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-event-service
spec:
  selector:
    app.kubernetes.io/name: kafka-event-service
  ports:
    - name: health
      port: 8100
      targetPort: health
