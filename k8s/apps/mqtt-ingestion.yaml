apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mqtt-ingestion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mqtt-ingestion
    spec:
      containers:
        - name: mqtt-ingestion
          image: smart-metering-mqtt-ingestion:k8s-local
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8090
          env:
            - name: MQTT_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-metering-config
                  key: MQTT_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: smart-metering-config
                  key: KAFKA_BROKERS
            - name: HEALTH_PORT
              value: "8090"
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-ingestion
spec:
  selector:
    app.kubernetes.io/name: mqtt-ingestion
  ports:
    - name: health
      port: 8090
      targetPort: health
