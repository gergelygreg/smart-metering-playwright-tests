apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-broker
  labels:
    app.kubernetes.io/name: mqtt-broker
    app.kubernetes.io/component: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mqtt-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mqtt-broker
        app.kubernetes.io/component: messaging
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.1.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: mqtt
              containerPort: 1883
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-broker
  labels:
    app.kubernetes.io/name: mqtt-broker
spec:
  selector:
    app.kubernetes.io/name: mqtt-broker
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
