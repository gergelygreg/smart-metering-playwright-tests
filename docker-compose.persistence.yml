services:
  postgres:
    image: postgres:17-alpine
    container_name: smart-metering-postgres
    environment:
      POSTGRES_DB: smart_metering
      POSTGRES_USER: smart_metering
      POSTGRES_PASSWORD: smart_metering
    ports:
      - "15432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U smart_metering -d smart_metering
      interval: 2s
      timeout: 3s
      retries: 30
