name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish validated images to GHCR
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.2"
  NPM_VERSION: "11.6.0"

jobs:
  backend:
    name: Backend - Maven / JPA / Flyway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: apps/backend/pom.xml
      - working-directory: apps/backend
        run: chmod +x mvnw && ./mvnw -B -ntp clean verify
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: apps/backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: TypeScript / Angular / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/frontend/package-lock.json
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright test --project=unit
      - working-directory: apps/frontend
        run: npm ci && npm test -- --watch=false && npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: angular-dist
          path: apps/frontend/dist/

  mqtt-components:
    name: MQTT Adapter / Device Simulator Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global npm@${NPM_VERSION}
      - working-directory: apps/mqtt-ingestion
        run: npm ci && npm run typecheck && npm test && npm run build
      - working-directory: apps/device-simulator
        run: npm ci && npm run typecheck && npm test && npm run build

  kafka-components:
    name: Kafka Event Service Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/kafka-event-service/package-lock.json
      - run: npm install --global npm@${NPM_VERSION}
      - working-directory: apps/kafka-event-service
        run: npm ci && npm run typecheck && npm test && npm run build

  docker-integration:
    name: Docker Full Stack - REST / MQTT / Kafka / UI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend, frontend, mqtt-components, kafka-components]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose -f docker-compose.full.yml --profile simulator config --quiet

      - name: Build application images sequentially
        shell: bash
        run: |
          set -euo pipefail
          for service in backend frontend mqtt-ingestion kafka-event-service device-simulator
          do
            echo "Building ${service}"
            docker compose -f docker-compose.full.yml --profile simulator build --pull "${service}"
          done

      - run: docker compose -f docker-compose.full.yml up -d

      - name: Wait for stack
        shell: bash
        run: |
          set -euo pipefail
          wait_url() {
            for i in $(seq 1 120); do
              if curl --fail --silent "$1" >/dev/null; then
                echo "$2 ready"
                return 0
              fi
              sleep 2
            done
            echo "$2 failed" >&2
            exit 1
          }
          wait_url http://127.0.0.1:18080/api/health backend
          wait_url http://127.0.0.1:8088/healthz frontend
          wait_url http://127.0.0.1:18090/health mqtt-ingestion
          wait_url http://127.0.0.1:18100/health kafka-event-service
          test "$(docker inspect --format '{{.State.Status}}/{{.State.Health.Status}}' smart-metering-full-kafka)" = "running/healthy"

      - name: REST API
        env:
          API_BASE_URL: http://127.0.0.1:18080
        run: npm run test:api

      - name: MQTT through Kafka
        env:
          MQTT_API_BASE_URL: http://127.0.0.1:18080
          MQTT_URL: mqtt://127.0.0.1:1883
        run: npm run test:mqtt

      - name: Kafka contracts
        env:
          KAFKA_API_BASE_URL: http://127.0.0.1:18080
          KAFKA_BROKER: 127.0.0.1:29092
          KAFKA_EVENT_SERVICE_BASE_URL: http://127.0.0.1:18100
        run: npm run test:kafka

      - name: Browser E2E
        env:
          UI_BASE_URL: http://127.0.0.1:8088
          UI_API_BASE_URL: http://127.0.0.1:18080
          MQTT_URL: mqtt://127.0.0.1:1883
        run: npm run test:ui

      - name: Real simulator event-chain acceptance
        shell: bash
        run: |
          set -euo pipefail
          serial="CI-KAFKA-SIM-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker compose -f docker-compose.full.yml --profile simulator run --rm \
            -e "SIM_SERIAL_NUMBER=${serial}" \
            -e SIM_PROFILE=mixed \
            -e SIM_COUNT=4 \
            -e SIM_INTERVAL_MS=100 \
            device-simulator
          SIM_SERIAL_NUMBER="${serial}" \
          EXPECTED_READINGS=4 \
          EXPECT_ALARM=true \
          API_BASE_URL=http://127.0.0.1:18080 \
          KAFKA_EVENT_SERVICE_BASE_URL=http://127.0.0.1:18100 \
          node scripts/assert-simulator-output.mjs

      - name: Capture artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p .ci-artifacts
          docker compose -f docker-compose.full.yml ps > .ci-artifacts/compose-ps.txt || true
          docker compose -f docker-compose.full.yml logs --no-color > .ci-artifacts/compose.log || true
          curl --silent http://127.0.0.1:18100/health > .ci-artifacts/kafka-health.json || true
          curl --silent http://127.0.0.1:18100/events > .ci-artifacts/kafka-events.json || true
          for report in playwright-report playwright-report-mqtt playwright-report-kafka playwright-report-ui test-results
          do
            [ ! -d "$report" ] || cp -R "$report" ".ci-artifacts/$report"
          done

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-event-streaming-artifacts
          path: .ci-artifacts/
          if-no-files-found: ignore

      - if: always()
        run: docker compose -f docker-compose.full.yml down --volumes --remove-orphans

  kubernetes-integration:
    name: Kubernetes Kind - Orchestration / E2E
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs:
      - docker-integration

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use deterministic npm version
        run: npm install --global npm@${NPM_VERSION}

      - name: Install automation dependencies
        run: npm ci

      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Kubernetes kind acceptance
        run: bash scripts/k8s/ci-kind-acceptance.sh

      - name: Upload Kubernetes diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kubernetes-kind-artifacts
          path: .k8s-runtime/
          if-no-files-found: ignore
          retention-days: 14
  publish-images:
    name: Publish validated images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [docker-integration, kubernetes-integration]
    if: >-
      ${{
        (github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_images)
      }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smart-metering-api
            context: ./apps/backend
            file: ./apps/backend/Dockerfile
          - name: smart-metering-ui
            context: ./apps/frontend
            file: ./apps/frontend/Dockerfile
          - name: smart-metering-mqtt-ingestion
            context: ./apps/mqtt-ingestion
            file: ./apps/mqtt-ingestion/Dockerfile
          - name: smart-meter-device-simulator
            context: ./apps/device-simulator
            file: ./apps/device-simulator/Dockerfile
          - name: smart-metering-kafka-event-service
            context: ./apps/kafka-event-service
            file: ./apps/kafka-event-service/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - id: repo
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
