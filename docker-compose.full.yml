name: smart-metering-full

services:
  postgres:
    image: postgres:17-alpine
    container_name: smart-metering-full-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_metering}
      POSTGRES_USER: ${POSTGRES_USER:-smart_metering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_metering}
    volumes:
      - smart_metering_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-smart_metering} -d ${POSTGRES_DB:-smart_metering}"
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - smart-metering

  mqtt-broker:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: smart-metering-full-mqtt
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 5 >/dev/null 2>&1"
        ]
      interval: 3s
      timeout: 6s
      retries: 20
      start_period: 5s
    networks:
      - smart-metering

  kafka:
    image: apache/kafka:4.3.1
    container_name: smart-metering-full-kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://127.0.0.1:${KAFKA_HOST_PORT:-29092}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports:
      - "${KAFKA_HOST_PORT:-29092}:9092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:19092 --list >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 8s
      retries: 30
      start_period: 15s
    networks:
      - smart-metering

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: smart-metering-full-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        for topic in \
          smart-metering.telemetry.received.v1 \
          smart-metering.reading.persisted.v1 \
          smart-metering.alarm.created.v1
        do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:19092 \
            --create --if-not-exists \
            --topic "$${topic}" \
            --partitions 3 \
            --replication-factor 1 \
            --config retention.ms=86400000
        done

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --list
    networks:
      - smart-metering

  backend:
    image: smart-metering-api:${IMAGE_TAG:-local}
    container_name: smart-metering-full-backend
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smart_metering}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smart_metering}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smart_metering}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75.0
        -Dfile.encoding=UTF-8
        -Duser.timezone=UTC
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-18080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --show-error http://127.0.0.1:8080/api/health >/dev/null"
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    init: true
    networks:
      - smart-metering

  mqtt-ingestion:
    image: smart-metering-mqtt-ingestion:${IMAGE_TAG:-local}
    container_name: smart-metering-full-mqtt-ingestion
    build:
      context: ./apps/mqtt-ingestion
      dockerfile: Dockerfile
    environment:
      MQTT_URL: mqtt://mqtt-broker:1883
      KAFKA_BROKERS: kafka:19092
      HEALTH_PORT: 8090
    depends_on:
      mqtt-broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${MQTT_INGESTION_HOST_PORT:-18090}:8090"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8090/health >/dev/null 2>&1"
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    init: true
    networks:
      - smart-metering

  kafka-event-service:
    image: smart-metering-kafka-event-service:${IMAGE_TAG:-local}
    container_name: smart-metering-full-kafka-event-service
    build:
      context: ./apps/kafka-event-service
      dockerfile: Dockerfile
    environment:
      KAFKA_BROKERS: kafka:19092
      API_BASE_URL: http://backend:8080
      HEALTH_PORT: 8100
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    ports:
      - "${KAFKA_EVENT_SERVICE_HOST_PORT:-18100}:8100"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8100/health >/dev/null 2>&1"
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    init: true
    networks:
      - smart-metering

  frontend:
    image: smart-metering-ui:${IMAGE_TAG:-local}
    container_name: smart-metering-full-frontend
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-8088}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1"
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    init: true
    networks:
      - smart-metering

  device-simulator:
    image: smart-meter-device-simulator:${IMAGE_TAG:-local}
    build:
      context: ./apps/device-simulator
      dockerfile: Dockerfile
    profiles:
      - simulator
    environment:
      MQTT_URL: mqtt://mqtt-broker:1883
      API_BASE_URL: http://backend:8080
      SIM_SERIAL_NUMBER: ${SIM_SERIAL_NUMBER:-SIM-DOCKER-0001}
      SIM_FIRMWARE_VERSION: ${SIM_FIRMWARE_VERSION:-sim-1.0.0}
      SIM_PROFILE: ${SIM_PROFILE:-normal}
      SIM_COUNT: ${SIM_COUNT:-10}
      SIM_INTERVAL_MS: ${SIM_INTERVAL_MS:-1000}
      SIM_INITIAL_ENERGY_KWH: ${SIM_INITIAL_ENERGY_KWH:-12500}
    depends_on:
      mqtt-broker:
        condition: service_healthy
      mqtt-ingestion:
        condition: service_healthy
      kafka-event-service:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - smart-metering

volumes:
  smart_metering_postgres_data:

networks:
  smart-metering:
    driver: bridge
