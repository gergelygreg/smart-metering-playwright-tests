name: smart-metering-full

services:
  postgres:
    image: postgres:17-alpine
    container_name: smart-metering-full-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_metering}
      POSTGRES_USER: ${POSTGRES_USER:-smart_metering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_metering}
    volumes:
      - smart_metering_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-smart_metering} -d ${POSTGRES_DB:-smart_metering}"
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - smart-metering

  mqtt-broker:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: smart-metering-full-mqtt
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 5 >/dev/null 2>&1"
        ]
      interval: 3s
      timeout: 6s
      retries: 20
      start_period: 5s
    networks:
      - smart-metering

  backend:
    image: smart-metering-api:${IMAGE_TAG:-local}
    container_name: smart-metering-full-backend
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smart_metering}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smart_metering}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smart_metering}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75.0
        -Dfile.encoding=UTF-8
        -Duser.timezone=UTC
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-18080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --show-error http://127.0.0.1:8080/api/health >/dev/null"
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    init: true
    networks:
      - smart-metering

  mqtt-ingestion:
    image: smart-metering-mqtt-ingestion:${IMAGE_TAG:-local}
    container_name: smart-metering-full-mqtt-ingestion
    build:
      context: ./apps/mqtt-ingestion
      dockerfile: Dockerfile
    environment:
      MQTT_URL: mqtt://mqtt-broker:1883
      API_BASE_URL: http://backend:8080
      HEALTH_PORT: 8090
    depends_on:
      mqtt-broker:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${MQTT_INGESTION_HOST_PORT:-18090}:8090"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8090/health >/dev/null 2>&1"
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    init: true
    networks:
      - smart-metering

  frontend:
    image: smart-metering-ui:${IMAGE_TAG:-local}
    container_name: smart-metering-full-frontend
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-8088}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1"
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    init: true
    networks:
      - smart-metering

  device-simulator:
    image: smart-meter-device-simulator:${IMAGE_TAG:-local}
    build:
      context: ./apps/device-simulator
      dockerfile: Dockerfile
    profiles:
      - simulator
    environment:
      MQTT_URL: mqtt://mqtt-broker:1883
      API_BASE_URL: http://backend:8080
      SIM_SERIAL_NUMBER: ${SIM_SERIAL_NUMBER:-SIM-DOCKER-0001}
      SIM_FIRMWARE_VERSION: ${SIM_FIRMWARE_VERSION:-sim-1.0.0}
      SIM_PROFILE: ${SIM_PROFILE:-normal}
      SIM_COUNT: ${SIM_COUNT:-10}
      SIM_INTERVAL_MS: ${SIM_INTERVAL_MS:-1000}
      SIM_INITIAL_ENERGY_KWH: ${SIM_INITIAL_ENERGY_KWH:-12500}
    depends_on:
      mqtt-broker:
        condition: service_healthy
      backend:
        condition: service_healthy
      mqtt-ingestion:
        condition: service_healthy
    networks:
      - smart-metering

volumes:
  smart_metering_postgres_data:

networks:
  smart-metering:
    driver: bridge